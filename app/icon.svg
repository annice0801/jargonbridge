<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b352f"/>
      <stop offset="1" stop-color="#1d1a17"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee4"/>
      <stop offset="1" stop-color="#d9cfc0"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4703f"/>
      <stop offset="1" stop-color="#b8532c"/>
