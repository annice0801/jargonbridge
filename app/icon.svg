  <!-- 拱橋：連接兩岸 -->
  <path d="M19.5 40.5 Q32 27.5 44.5 40.5" fill="none" stroke="url(#arch)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M24.6 38.4 V43.2 M39.4 38.4 V43.2" stroke="#c45f33" stroke-width="2" stroke-linecap="round"/>
  <path d="M16.5 44.2 H47.5" stroke="#efe8dc" stroke-opacity="0.38" stroke-width="1.3" stroke-linecap="round"/>
